name: wasm64 toolchain

# The trimmed toolchain for the wasm64 targets (`ci/wasm64-toolchain.sh`).
#
# - A `v*` tag builds and publishes a release named after the tag, carrying
#   the tarball, its sha256 and the package list of the build image. A user
#   pins the release's sha256.
# - A push to a `wasm64-toolchain-*` branch, or a dispatch, builds and
#   publishes nothing (a dispatch needs the workflow on the default branch; a
#   branch push does not).
#
# x86_64 Linux only. Upstream's `main.yml` builds the full wasi-sdk for every
# host; this builds what a wasm64 module build on x86_64 Linux needs.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'wasm64-toolchain-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    # A cold LLVM build on a 4-vCPU runner; the hosted maximum is 360.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # version.py runs `git describe`, which needs the history.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout

      # This repository carries few of upstream's release tags (and its
      # `wasi-sdk-29` is a different object from upstream's, hence the forced
      # refspec), and without a reachable `wasi-sdk-*` tag version.py fails
      # during configure. The
      # version names the dist tarballs, which this build does not make; the
      # toolchain's files do not contain it.
      - name: Fetch the wasi-sdk release tags
        run: >-
          git fetch --no-tags --no-recurse-submodules
          https://github.com/WebAssembly/wasi-sdk.git
          '+refs/tags/wasi-sdk-*:refs/tags/wasi-sdk-*'

      # BuildKit resolves the base image without leaving it in the local image
      # store, so pull it first: the build then uses it, and `Record the
      # image` can read its digest.
      - name: Build the image
        run: |
          docker pull almalinux:8
          docker build --tag wasm64-toolchain-builder --file ci/docker/Dockerfile ci/docker

      # What the image holds, published beside the tarball: the host compiler
      # and libraries the toolchain was built with.
      - name: Record the image
        run: |
          set -euo pipefail
          mkdir -p dist
          {
            echo "# base image"
            docker image inspect almalinux:8 --format '{{join .RepoDigests "\n"}}'
            echo "# packages"
            docker run --rm wasm64-toolchain-builder rpm -qa | sort
          } > dist/build-env.txt
          cat dist/build-env.txt

      - name: Build the toolchain
        run: >-
          docker run --rm --init
          --workdir /src --volume "$PWD:/src"
          --user "$(id -u):$(id -g)"
          wasm64-toolchain-builder
          ci/wasm64-toolchain.sh build build/wasm64

      - name: Package
        run: ci/wasm64-toolchain.sh package build/wasm64 dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolchain
          path: dist/
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolchain
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "The toolchain for the wasm64-wasip1 and wasm64-wasip1-threads targets:"
            echo "clang, lld and the LLVM binutils, built by \`ci/wasm64-toolchain.sh\` from"
            echo "$GITHUB_SHA, without LLDB, clang-tools-extra or wasm-component-ld."
            echo "\`build-env.txt\` lists the build image's packages."
            echo
            echo '```'
            cat dist/*.tar.zst.sha256
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.tar.zst dist/*.tar.zst.sha256 dist/build-env.txt
